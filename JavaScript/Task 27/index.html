<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind JS File -->
    <script src="js/tailwind.min.js"></script>
    <title>Task 27 | Change Color</title>
  </head>
  <body>
    <div class="container px-4 w-full sm:w-[80%] md:w-[60%] lg:w-[50%] mx-auto">
      <div
        class="color-circle w-24 sm:w-40 h-24 sm:h-40 mx-auto rounded-full my-10 bg-green-600"
      ></div>
      <div class="flex items-center justify-between gap-4 px-4 sm:px-12">
        <button
          data-color="red"
          data-location="40px auto 40px 0"
          class="rounded-md bg-red-600 hover:bg-red-500 cursor-pointer py-2 px-4 outline-none text-white font-semibold"
        >
          Red
        </button>
        <button
          data-color="green"
          data-location="40px auto"
          class="rounded-md bg-green-600 hover:bg-green-500 cursor-pointer py-2 px-4 outline-none text-white font-semibold"
        >
          Green
        </button>
        <button
          data-color="blue"
          data-location="40px 0 40px auto"
          class="rounded-md bg-blue-600 hover:bg-blue-500 cursor-pointer py-2 px-4 outline-none text-white font-semibold"
        >
          Blue
        </button>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
