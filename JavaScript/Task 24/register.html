<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS File -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <!-- My CSS File -->
    <link rel="stylesheet" href="css/style.css" />

    <title>Task 24 | Register</title>
  </head>
  <body>
    <div class="container mt-12">
      <div class="row">
        <div class="md:col-6 mb-5">
          <img
            src="img/56f58c5bbae6320e1aa5d36445fd722b.jpg"
            class="w-75 d-block m-auto"
          />
        </div>
        <div class="md:col-6 d-flex flex-column justify-content-center">
          <h2>Welcome</h2>
          <p class="fg-secondary mb-5">
            Go ahead and ign up, let everyone <br />
            know how awesome you are!
          </p>
          <p id="errorMsg"></p>
          <form action="success.html" onsubmit="return validateInputs();">
            <input type="text" id="username" class="form-control mb-7 p-3" />
            <input type="text" id="email" class="form-control mb-7 p-3" />
            <input type="password" id="pass" class="form-control mb-7 p-3" />
            <input
              id="confirmPass"
              type="password"
              class="form-control mb-7 p-3"
            />
            <input
              type="submit"
              value="Create New Account"
              class="btn-solid d-block w-100 theme-primary fw-bold text-center"
            />
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap js File -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <!-- My js File -->
    <script src="js/main.js"></script>
  </body>
</html>
