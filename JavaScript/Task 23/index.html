<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS File -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <!-- My CSS File -->
    <link rel="stylesheet" href="css/style.css" />
    <title>Task 23</title>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-12 text-center mt-12">
          <h2>Convert Your Money</h2>
        </div>
        <div class="col-12">
          <form onsubmit="return convertMoney();">
            <input
              id="valueInput"
              type="text"
              name="money"
              placeholder="Enter Your Money in Dollars"
              class="form-control my-8 p-3 fs-lg"
            />
            <button
              type="submit"
              class="d-block btn-solid theme-accent w-100 p-3 fs-lg"
            >
              Convert
            </button>
          </form>
        </div>
        <div class="col-12">
          <p id="egyptResult" class="text-white mt-5 fs-lg"></p>
        </div>
        <div class="col-12">
          <p id="saudiResult" class="text-white mt-3 fs-lg"></p>
        </div>
      </div>
    </div>
    <!-- Bootstrap js File -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <!-- My js File -->
    <script src="js/main.js"></script>
  </body>
</html>
