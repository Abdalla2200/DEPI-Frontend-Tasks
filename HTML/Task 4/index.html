<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 4</title>
  </head>
  <body>
    <!-- Start Form Section -->
    <br />
    <br />
    <form action="about.html" method="get" target="_blank">
      <label>Choose Color:</label>
      <input type="color" />
      <br />
      <hr />
      <br />
      <label>Choose Your Framework</label>
      <select name="framework">
        <option selected disabled>--choose one</option>
        <option value="react">React</option>
        <option value="nextJs">Next Js</option>
        <option value="angular">Angular</option>
        <option value="vueJs">Vue Js</option>
        <option value="laravel">Laravel</option>
      </select>
      <br />
      <hr />
      <br />
      <input type="text" list="frameworks" />
      <datalist id="frameworks">
        <option>React</option>
        <option>Next Js</option>
        <option>Angular</option>
        <option>Vue Js</option>
        <option>Laravel</option>
      </datalist>
      <br />
      <hr />
      <br />
      <label>Your Message</label>
      <textarea name="message" rows="5" cols="20" maxlength="100"></textarea>
      <br />
      <hr />
      <br />

      <input type="submit" />
      <input type="reset" />
      <input
        type="submit"
        name="login"
        value="login"
        formaction="login.html"
        formtarget="_blank"
      />
    </form>
    <!-- End Form Section -->
    <br />
    <hr />
    <hr />
    <br />
    <!-- Start Iframe Section -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/qP23O70ve7k?si=kQpOxO-GU8cAgS85"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <br />
    <hr />
    <br />
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d55257.

    <iframe

      width="500px"
      height="400px"

    <br />
    <hr />
    <br />

    <!-- End Iframe Section -->
